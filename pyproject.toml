[project]
name = "inference-agent-challenge"
version = "0.1.0"
description = "Two-part AI engineering challenge: RAG over structured docs, and an n8n agent with Calendar/Gmail/web tools"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "fastembed>=0.4",
    "rank-bm25>=0.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "pdfplumber>=0.11",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.6",
    "sqlglot>=25.0",
    "streamlit>=1.38",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pre-commit>=4.0",
]
data = [
    "faker>=30.0",
    "reportlab>=4.2",
    "pandas>=2.2",
    "pdfplumber>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires a real ATLAS_ANTHROPIC_API_KEY and makes real API calls (skipped by default)",
]
addopts = "-m 'not live' --timeout=30"
timeout_method = "thread"
